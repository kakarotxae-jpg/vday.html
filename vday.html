<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Wini 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family: 'Comic Sans MS', cursive;
background: linear-gradient(-45deg,#ffc0cb,#ffb6c1,#ffd1dc,#ff9ecf);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
overflow-x:hidden;
text-align:center;
color:#a30059;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

h1{
margin-top:40px;
font-size:3em;
animation:floatTitle 3s ease-in-out infinite;
}

@keyframes floatTitle{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

button{
padding:12px 25px;
margin:20px;
border:none;
border-radius:25px;
background:white;
color:#a30059;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
background:#ff69b4;
color:white;
}

.gallery img{
width:220px;
border-radius:20px;
margin:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
transition:0.4s;
}

.gallery img:hover{
transform:scale(1.15) rotate(2deg);
}

.heart{
position:fixed;
color:#ff2e88;
animation:floatHearts 6s linear infinite;
font-size:20px;
}

@keyframes floatHearts{
0%{transform:translateY(100vh);opacity:1;}
100%{transform:translateY(-10vh);opacity:0;}
}

.cat{
position:fixed;
font-size:40px;
animation:catMove 20s linear infinite;
}

@keyframes catMove{
0%{left:-10%;}
100%{left:110%;}
}

#letter{
display:none;
max-width:600px;
margin:30px auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 15px 25px rgba(0,0,0,0.2);
color:#444;
line-height:1.6;
}

#loveMeter{
width:300px;
height:20px;
background:white;
margin:20px auto;
border-radius:20px;
overflow:hidden;
}

#loveFill{
height:100%;
width:0%;
background:#ff2e88;
transition:1s;
}

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<h1>For Wini 💖</h1>

<button onclick="showLetter()">Open My Letter 💌</button>
<button onclick="increaseLove()">Increase Love Meter ❤️</button>
<button onclick="launchFireworks()">Surprise 🎆</button>

<div id="loveMeter"><div id="loveFill"></div></div>

<div id="letter">
My dearest Wini,<br><br>
You are my favorite notification.<br>
My favorite memory.<br>
My favorite person.<br><br>
This little world I coded? It's just a reflection of how much joy you bring me.<br><br>
Forever yours,<br>
Arvin 💕
</div>

<div class="gallery">
<img src="kakarotxae-jpg">
</div>

<script>
// floating hearts
setInterval(()=>{
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=Math.random()*20+15+"px";
heart.style.animationDuration=Math.random()*3+3+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),6000);
},500);

// floating cats
setInterval(()=>{
let cat=document.createElement("div");
cat.className="cat";
cat.innerHTML="🐱";
cat.style.top=Math.random()*90+"vh";
cat.style.animationDuration=Math.random()*10+10+"s";
document.body.appendChild(cat);
setTimeout(()=>cat.remove(),20000);
},4000);

function showLetter(){
document.getElementById("letter").style.display="block";
}

let love=0;
function increaseLove(){
love+=10;
if(love>100) love=100;
document.getElementById("loveFill").style.width=love+"%";
}

// fireworks
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function launchFireworks(){
for(let i=0;i<100;i++){
particles.push({
x:canvas.width/2,
y:canvas.height/2,
radius:Math.random()*3+2,
color:`hsl(${Math.random()*360},100%,50%)`,
speedX:(Math.random()-0.5)*6,
speedY:(Math.random()-0.5)*6,
life:100
});
}
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach((p,index)=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
ctx.fillStyle=p.color;
ctx.fill();
p.x+=p.speedX;
p.y+=p.speedY;
p.life--;
if(p.life<=0) particles.splice(index,1);
});
requestAnimationFrame(animate);
}
animate();

window.addEventListener("resize",()=>{
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
});
</script>

</body>
</html>
